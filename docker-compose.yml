version: '3.8'

services:
  gate-simulator-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gate_simulator_api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
